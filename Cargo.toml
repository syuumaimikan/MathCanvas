[workspace]
members = [
    "crates/mathcanvas-core",
    "crates/mathcanvas-platform",
    "crates/mathcanvas-ui",
    "crates/mathcanvas-app",
    "crates/mathcanvas-graph",
    "crates/mathcanvas-cas",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MathCanvas Team"]

[workspace.dependencies]
egui = "0.29.1"
eframe = "0.29.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.43.0", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
