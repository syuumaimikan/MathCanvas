plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.mozilla.rust-android-gradle.rust-android'
}

android {
    namespace 'com.mathcanvas.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.mathcanvas.app"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

cargo {
    module = "../../crates/mathcanvas-app" // Path to the Cargo.toml containing the cdylib
    libname = "mathcanvas_app"
    targets = ["arm", "arm64", "x86", "x86_64"]
    profile = "release"
    // eframe/android-activity requires certain features
    extraCargoBuildArguments = ["--features", "android"] 
}

afterEvaluate {
    // Ensure cargo builds before assembling the APK
    tasks.whenTaskAdded { task ->
        if (task.name == 'mergeDebugJniLibFolders' || task.name == 'mergeReleaseJniLibFolders') {
            task.dependsOn 'cargoBuild'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}
